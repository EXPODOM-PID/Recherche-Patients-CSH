name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl xlrd pyinstaller
    
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "Recherche_Patients_CSH" --icon=NONE recherche_patients_CSH_app.py
    
    - name: Upload EXE artifact
      uses: actions/upload-artifact@v3
      with:
        name: Recherche_Patients_CSH_Windows
        path: dist/Recherche_Patients_CSH.exe
        retention-days: 90
